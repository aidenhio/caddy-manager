{% extends "base.html" %}

{% block title %}Edit {{ filename }} - Caddy Manager{% endblock %}
{% block page_pretitle %}Caddy{% endblock %}
{% block page_title %}Edit Site{% endblock %}

{% block header_actions %}
{% endblock %}

<!---->

{% block content %}
<div class="row">
  <div class="col">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Editing <span class="badge bg-lt font-monospace">{{ filename }}</span></h3>
      </div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <textarea name="content" class="form-control" rows="18" style="font-family:var(--tblr-font-monospace, monospace)">{{ content }}</textarea>
          </div>
          <div class="form-footer d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              Save Changes</button>
            <a href="{{ url_for('sites') }}" class="btn">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
