<!-- BEGIN QUICK ADD BUTTON -->
{% if quick_add_type %}
  {% set qa_label = type_label(quick_add_type) %}
  <a href="{{ url_for('main.new_block', block_type=quick_add_type) }}" class="btn btn-{{ type_color(quick_add_type) }} btn-5 d-none d-sm-inline-block"
     title="Quick add a {{ qa_label }} block">
    {{ type_icon(quick_add_type, 'icon icon-2') }}
    Add {{ qa_label }}
  </a>
{% endif %}
<!-- END QUICK ADD BUTTON -->
